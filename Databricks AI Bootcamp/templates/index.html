<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 600px; }
        .left-panel, .right-panel { padding: 30px; }
        .left-panel { border-right: 1px solid #e0e0e0; }
        .section-title { font-size: 1.5em; margin-bottom: 20px; color: #333; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .btn-success { background: #48bb78; color: white; }
        .btn-small { padding: 8px 16px; font-size: 13px; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border: 2px solid #e0e0e0; background: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
        .filter-btn:hover { border-color: #667eea; }
        .filter-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .tickets-list { display: flex; flex-direction: column; gap: 12px; max-height: 500px; overflow-y: auto; }
        .ticket-card { background: white; border: 2px solid #e0e0e0; border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.2s; }
        .ticket-card:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102,126,234,0.2); }
        .ticket-card.selected { border-color: #667eea; background: #f0f4ff; }
        .ticket-id { font-weight: 700; color: #667eea; font-size: 0.9em; }
        .ticket-subject { font-size: 1.1em; font-weight: 600; color: #2d3748; margin-bottom: 8px; }
        .ticket-meta { display: flex; gap: 10px; font-size: 0.85em; color: #718096; flex-wrap: wrap; }
        .status-badge, .priority-badge { padding: 4px 12px; border-radius: 12px; font-size: 0.75em; font-weight: 600; text-transform: uppercase; }
        .status-open { background: #c6f6d5; color: #22543d; }
        .status-in_progress { background: #feebc8; color: #7c2d12; }
        .status-resolved { background: #bee3f8; color: #2c5282; }
        .status-closed { background: #e2e8f0; color: #2d3748; }
        .priority-high { background: #fed7d7; color: #742a2a; }
        .priority-medium { background: #feebc8; color: #7c2d12; }
        .priority-low { background: #c6f6d5; color: #22543d; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #2d3748; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .ticket-detail { display: none; }
        .ticket-detail.active { display: block; }
        .detail-header { border-bottom: 2px solid #e0e0e0; padding-bottom: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .detail-meta { display: flex; gap: 10px; flex-wrap: wrap; }
        .messages-list { margin-bottom: 20px; }
        .message-card { background: #f7fafc; border-left: 4px solid #667eea; padding: 15px; border-radius: 6px; margin-bottom: 12px; }
        .message-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85em; color: #718096; }
        .message-author { font-weight: 600; color: #2d3748; }
        .message-text { color: #2d3748; line-height: 1.6; }
        .empty-state { text-align: center; padding: 60px 20px; color: #718096; }
        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .alert-success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .alert-error { background: #fed7d7; color: #742a2a; border: 1px solid #fc8181; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 Support Ticket System</h1>
            <p>Manage your support tickets with ease</p>
        </div>
        <div class="main-content">
            <div class="left-panel">
                <div class="section-title">
                    <span>Tickets</span>
                    <button class="btn btn-primary btn-small" onclick="showNewTicketForm()">+ New Ticket</button>
                </div>
                <div id="newTicketForm" class="hidden" style="margin-bottom: 20px; padding: 20px; background: #f7fafc; border-radius: 8px;">
                    <h3 style="margin-bottom: 15px;">Create New Ticket</h3>
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="newTitle" placeholder="Brief description of the issue">
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="newPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-success" onclick="createTicket()">Create Ticket</button>
                        <button class="btn" style="background: #e2e8f0;" onclick="hideNewTicketForm()">Cancel</button>
                    </div>
                </div>
                <div class="filter-bar">
                    <button class="filter-btn active" onclick="filterTickets('all')">All</button>
                    <button class="filter-btn" onclick="filterTickets('open')">Open</button>
                    <button class="filter-btn" onclick="filterTickets('in_progress')">In Progress</button>
                    <button class="filter-btn" onclick="filterTickets('resolved')">Resolved</button>
                    <button class="filter-btn" onclick="filterTickets('closed')">Closed</button>
                </div>
                <div id="alertContainer"></div>
                <div class="tickets-list" id="ticketsList">
                    <div class="empty-state"><p>Loading tickets...</p></div>
                </div>
            </div>
            <div class="right-panel">
                <div id="emptyDetail" class="empty-state">
                    <h3>Select a ticket to view details</h3>
                </div>
                <div id="ticketDetail" class="ticket-detail"></div>
            </div>
        </div>
    </div>
    <script>
        let currentTicketId = null;
        let currentFilter = 'all';
        let allTickets = [];
        
        document.addEventListener('DOMContentLoaded', () => loadTickets());
        
        function showAlert(message, type = 'success') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            document.getElementById('alertContainer').appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
        
        function showNewTicketForm() { document.getElementById('newTicketForm').classList.remove('hidden'); }
        function hideNewTicketForm() { 
            document.getElementById('newTicketForm').classList.add('hidden'); 
            document.getElementById('newTitle').value = '';
            document.getElementById('newPriority').value = 'medium';
        }
        
        function filterTickets(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTickets();
        }
        
        function renderTickets() {
            const container = document.getElementById('ticketsList');
            const filtered = currentFilter === 'all' ? allTickets : allTickets.filter(t => t.status === currentFilter);
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No tickets found</p></div>';
                return;
            }
            
            container.innerHTML = filtered.map(t => `
                <div class="ticket-card ${currentTicketId === t.ticket_id ? 'selected' : ''}" onclick="selectTicket(${t.ticket_id})">
                    <div class="ticket-id">#${t.ticket_id}</div>
                    <div class="ticket-subject">${t.title}</div>
                    <div class="ticket-meta">
                        <span class="status-badge status-${t.status}">${t.status.replace('_', ' ')}</span>
                        <span class="priority-badge priority-${t.priority}">${t.priority}</span>
                        <span>${new Date(t.created_at).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }
        
        async function loadTickets() {
            try {
                const response = await fetch('/tickets');
                allTickets = await response.json();
                renderTickets();
            } catch (error) {
                showAlert('Error loading tickets', 'error');
            }
        }
        
        async function selectTicket(ticketId) {
            currentTicketId = ticketId;
            try {
                const [t, msgs] = await Promise.all([
                    fetch(`/tickets/${ticketId}`).then(r => r.json()),
                    fetch(`/tickets/${ticketId}/messages`).then(r => r.json())
                ]);
                document.getElementById('emptyDetail').style.display = 'none';
                const detail = document.getElementById('ticketDetail');
                detail.classList.add('active');
                detail.innerHTML = `
                    <div class="detail-header">
                        <div>
                            <h2>${t.title}</h2>
                            <div class="detail-meta">
                                <span class="ticket-id">#${t.ticket_id}</span>
                                <span class="status-badge status-${t.status}">${t.status.replace('_', ' ')}</span>
                                <span class="priority-badge priority-${t.priority}">${t.priority}</span>
                            </div>
                        </div>
                        <select id="statusSelect" onchange="updateStatus(${t.ticket_id})" style="padding:8px; border-radius:6px; border:2px solid #e0e0e0;">
                            <option value="open" ${t.status === 'open' ? 'selected' : ''}>Open</option>
                            <option value="in_progress" ${t.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                            <option value="resolved" ${t.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                            <option value="closed" ${t.status === 'closed' ? 'selected' : ''}>Closed</option>
                        </select>
                    </div>
                    <div style="margin-bottom:20px;">
                        <p style="color:#718096;">Created by: <strong>${t.created_by}</strong></p>
                        <p style="color:#718096;">${new Date(t.created_at).toLocaleString()}</p>
                    </div>
                    <div class="messages-section">
                        <h3 style="margin-bottom:15px;">Messages (${msgs.length})</h3>
                        <div class="messages-list">
                            ${msgs.length > 0 ? msgs.map(m => `
                                <div class="message-card">
                                    <div class="message-header">
                                        <span class="message-author">${m.author}</span>
                                        <span>${new Date(m.created_at).toLocaleString()}</span>
                                    </div>
                                    <div class="message-text">${m.message_text}</div>
                                </div>
                            `).join('') : '<p style="text-align:center;padding:20px;color:#718096;">No messages yet</p>'}
                        </div>
                        <div class="form-group">
                            <label>Add a message</label>
                            <textarea id="newMessage" placeholder="Type your message..."></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="addMessage(${t.ticket_id})">Send Message</button>
                    </div>
                `;
                renderTickets();
            } catch (error) {
                showAlert('Error loading ticket', 'error');
            }
        }
        
        async function createTicket() {
            const title = document.getElementById('newTitle').value.trim();
            const priority = document.getElementById('newPriority').value;
            if (!title) { showAlert('Title is required', 'error'); return; }
            try {
                const r = await fetch('/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, priority })
                });
                const ticket = await r.json();
                if (r.ok) {
                    showAlert('Ticket created!');
                    hideNewTicketForm();
                    await loadTickets();
                    selectTicket(ticket.ticket_id);
                } else {
                    showAlert(ticket.error || 'Error', 'error');
                }
            } catch (error) {
                showAlert('Error creating ticket', 'error');
            }
        }
        
        async function addMessage(ticketId) {
            const message_text = document.getElementById('newMessage').value.trim();
            if (!message_text) { showAlert('Message required', 'error'); return; }
            try {
                const r = await fetch(`/tickets/${ticketId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message_text })
                });
                if (r.ok) {
                    showAlert('Message added!');
                    document.getElementById('newMessage').value = '';
                    selectTicket(ticketId);
                } else {
                    showAlert('Error adding message', 'error');
                }
            } catch (error) {
                showAlert('Error', 'error');
            }
        }
        
        async function updateStatus(ticketId) {
            const status = document.getElementById('statusSelect').value;
            try {
                const r = await fetch(`/tickets/${ticketId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if (r.ok) {
                    showAlert('Status updated!');
                    await loadTickets();
                    selectTicket(ticketId);
                } else {
                    showAlert('Error updating status', 'error');
                }
            } catch (error) {
                showAlert('Error', 'error');
            }
        }
    </script>
</body>
</html>
