# Databricks App Configuration
# Support Ticket System

command:
  - "python"
  - "app.py"

env:
  # Flask configuration
  - name: FLASK_RUN_HOST
    value: "0.0.0.0"
  - name: FLASK_RUN_PORT
    value: "8000"
  
  # Lakebase connection configuration
  # Replace these values with your actual Lakebase credentials
  - name: LAKEBASE_HOST
    value: "your-lakebase-host.databricks.com"
  - name: LAKEBASE_PORT
    value: "5432"
  - name: LAKEBASE_DATABASE
    value: "your_database_name"
  - name: LAKEBASE_USER
    value: "your_username"
  - name: LAKEBASE_PASSWORD
    value: "your_password"
  
  # Table names (optional - defaults are provided in app.py)
  - name: TICKETS_TABLE_NAME
    value: "tickets"
  - name: TICKET_MESSAGES_TABLE_NAME
    value: "ticket_messages"

resources:
  # Resource requirements for the app
  cpu: "1"
  memory: "1Gi"
