# Databricks App Configuration
# Support Ticket System

command:
  - "python"
  - "app.py"

env:
  # Flask configuration
  - name: FLASK_RUN_HOST
    value: "0.0.0.0"
  - name: FLASK_RUN_PORT
    value: "8000"
  
  # Lakebase connection configuration
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  
  # Table names (optional - defaults are provided in app.py)
  - name: TICKETS_TABLE_NAME
    value: "tickets"
  - name: TICKET_MESSAGES_TABLE_NAME
    value: "ticket_messages"

resources:
  # Resource requirements for the app
  cpu: "1"
  memory: "1Gi"
